<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Todo List</title>
  </head>
  <body>
    <div class="container">
      <header><h1>Todo List</h1></header>

      <main>
        <div class="content-wrapper">
          <div class="date-wrapper">
            <strong class="date-wrapper__day">Today</strong>
            <span class="date-wrapper__full-date"></span>
          </div>

          <p class="empty">작성된 할 일이 없어요.</p>
          <ul class="todo-list"></ul>
        </div>

        <div class="todo__form-wrapper">
          <form class="todo__form">
            <input
              type="text"
              class="todo__input"
              placeholder="할 일을 작성해주세요."
            />

            <button
              type="submit"
              class="icon-button todo__add-button"
              data-type="add"
            >
              <img src="./assets/plus.svg" alt="todo-add-button" />
            </button>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
